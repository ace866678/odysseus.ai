name: Package SmolLM2 model weights for GitHub

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-smollm2.yml"
      - "static/js/localModel.js"
      - "models/smollm2/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smollm2-release-main
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download SmolLM2 ONNX weights and tokenizer
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="onnx-community/SmolLM2-360M-Instruct-ONNX",
              local_dir="models/smollm2",
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "merges.txt",
                  "special_tokens_map.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "vocab.json",
                  "onnx/model_q4f16.onnx",
                  "onnx/model_quantized.onnx",
              ],
          )
          PY

      - name: Package model files
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          zip -r smollm2-360m-onnx.zip models/smollm2 -x "*/.cache/*"
          ls -lh smollm2-360m-onnx.zip

      - name: Publish weights as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="smollm2-360m-onnx-v1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" smollm2-360m-onnx.zip --clobber
          else
            gh release create "$TAG" smollm2-360m-onnx.zip \
              --target main \
              --title "SmolLM2 360M ONNX v1" \
              --notes "SmolLM2 360M Instruct ONNX weights for Odysseus AI. Includes q4f16 WebGPU and quantized WASM weights plus tokenizer/config files. Stored as a GitHub Release asset because GitHub blocks new Git LFS uploads from public forks." \
              --prerelease
          fi
