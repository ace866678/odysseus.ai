name: Store SmolLM2 model weights in Git LFS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-smollm2.yml"
      - "static/js/localModel.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smollm2-lfs-main
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          fetch-depth: 0
          persist-credentials: true

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download SmolLM2 ONNX weights and tokenizer
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="onnx-community/SmolLM2-360M-Instruct-ONNX",
              local_dir="models/smollm2",
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "merges.txt",
                  "special_tokens_map.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "vocab.json",
                  "onnx/model_q4f16.onnx",
                  "onnx/model_quantized.onnx",
              ],
          )
          PY

      - name: Track large weights with Git LFS and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git lfs track "models/smollm2/onnx/*.onnx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes models/smollm2
          if git diff --cached --quiet; then
            echo "Model assets already match; nothing to commit."
            exit 0
          fi
          git commit -m "Download SmolLM2 ONNX weights into Git LFS"
          git push origin HEAD:main
