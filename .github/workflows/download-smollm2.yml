name: Package SmolLM2 model weights for GitHub

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-smollm2.yml"
      - "static/js/localModel.js"
      - "models/smollm2/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smollm2-release-main
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download SmolLM2 ONNX weights and tokenizer
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="onnx-community/SmolLM2-360M-Instruct-ONNX",
              local_dir="models/smollm2",
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "merges.txt",
                  "special_tokens_map.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "vocab.json",
                  "onnx/model_q4f16.onnx",
                  "onnx/model_quantized.onnx",
              ],
          )
          PY

      - name: Package model files
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          zip -r smollm2-360m-onnx.zip models/smollm2 -x "*/.cache/*"
          ls -lh smollm2-360m-onnx.zip

      - name: Publish weights as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smollm2-360m-onnx-v1
          name: SmolLM2 360M ONNX v1
          target_commitish: main
          body: |
            SmolLM2 360M Instruct ONNX weights for Odysseus AI.
            Includes q4f16 WebGPU and quantized WASM weights plus tokenizer/config files.
            The source repository is a public fork, so GitHub does not allow this workflow to upload new Git LFS objects.
            The model is therefore packaged as a release asset instead of a 272+ MB Git blob.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: smollm2-360m-onnx.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
